name: octomus_vps_server CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vps-

      - name: Check octomus_vps_server
        run: cargo check -p octomus_vps_server --release

      - name: Test octomus_vps_server
        run: cargo test -p octomus_vps_server

      - name: Build octomus_vps_server release binary
        run: cargo build -p octomus_vps_server --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: octomus-vps-server-linux-x86_64
          path: target/release/octomus-vps-server
